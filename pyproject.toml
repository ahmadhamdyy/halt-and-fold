[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "halt-and-fold"
version = "0.1.0"
description = "Persistent context for token-adaptive recurrent vision transformers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pillow",
  "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["rdvb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

